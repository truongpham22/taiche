<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Phân Loại Rác Tái Chế</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: Arial, sans-serif;
    background:#eef8ef;
    text-align:center;
    padding:20px;
}

.header{
    margin-bottom:20px;
}

.header h1{
    color:#2e7d32;
    font-size:28px;
}

.header p{
    color:#666;
    margin-top:8px;
}

.start-btn{
    background:#43a047;
    color:white;
    border:none;
    padding:12px 24px;
    border-radius:12px;
    font-size:16px;
    cursor:pointer;
    margin-top:16px;
}

#webcam-container{
    margin-top:20px;
}

#webcam-container canvas{
    border-radius:20px;
    box-shadow:0 4px 15px rgba(0,0,0,0.15);
    width:100%;
    max-width:350px;
}

.result-card{
    margin-top:20px;
    background:white;
    padding:20px;
    border-radius:20px;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.result-title{
    color:#2e7d32;
    margin-bottom:10px;
}

.result-name{
    font-size:32px;
    font-weight:bold;
    margin-bottom:10px;
}

.confidence{
    color:#666;
    margin-bottom:10px;
}

.guide{
    font-size:18px;
    color:#2e7d32;
}
</style>
</head>

<body>

<div class="header">
    <h1>♻️ Phân Loại Rác Tái Chế</h1>
    <p>Nhận diện giấy và nhựa bằng AI</p>

    <button class="start-btn" onclick="init()">
        Bắt đầu quét
    </button>
</div>

<div id="webcam-container"></div>

<div class="result-card">
    <h2 class="result-title">Kết quả nhận diện</h2>

    <div id="resultName" class="result-name">
        Chưa nhận diện
    </div>

    <div id="confidence" class="confidence">
        Độ chính xác: --
    </div>

    <div id="guide" class="guide">
        Hướng dẫn phân loại sẽ hiển thị ở đây
    </div>
</div>

<script>
const URL = "https://teachablemachine.withgoogle.com/models/DkYo_w50-/";

let model, webcam;

async function init() {

    const modelURL = URL + "model.json";
    const metadataURL = URL + "metadata.json";

    model = await tmImage.load(modelURL, metadataURL);

    webcam = new tmImage.Webcam(350, 350, true);

    await webcam.setup();
    await webcam.play();

    window.requestAnimationFrame(loop);

    document.getElementById("webcam-container").innerHTML = "";
    document.getElementById("webcam-container")
        .appendChild(webcam.canvas);
}

async function loop() {
    webcam.update();
    await predict();
    window.requestAnimationFrame(loop);
}

async function predict() {

    const predictions = await model.predict(webcam.canvas);

    let best = predictions[0];

    predictions.forEach(item => {
        if(item.probability > best.probability){
            best = item;
        }
    });

    const percent = (best.probability * 100).toFixed(1);

    document.getElementById("resultName").innerText =
        best.className;

    document.getElementById("confidence").innerText =
        "Độ chính xác: " + percent + "%";

    if(best.className === "Nhựa"){

        document.getElementById("guide").innerHTML =
            "🧴 Có thể tái chế<br>➡️ Bỏ vào thùng rác nhựa";

    }else if(best.className === "Giấy"){

        document.getElementById("guide").innerHTML =
            "📄 Có thể tái chế<br>➡️ Bỏ vào thùng rác giấy";
    }
}
</script>

</body>
</html>
